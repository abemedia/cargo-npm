[package]
name = "cargo-npm"
version = "0.1.4"
edition = "2024"
description = "Package and distribute Rust CLI binaries as npm packages"
repository = "https://github.com/abemedia/cargo-npm"
license = "MIT"
exclude = [".github/"]

[package.metadata.npm]
prefix = "@cargo-npm/"

[[bin]]
name = "cargo-npm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bzip2 = "0.6"
cargo-config2 = "0.1"
cargo-platform = "0.3"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
glob = "0.3"
lzma-rs = "0.3"
path-clean = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
strum = { version = "0.28", features = ["derive"] }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt"] }
zip = { version = "8", default-features = false, features = ["bzip2", "deflate-flate2", "lzma"] }

[dev-dependencies]
toml = "1"
wiremock = "0.6"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "warn"

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1
